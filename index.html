<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Désirer comme les autres · Ose Kairos</title>
<meta name="description" content="Outil d'esprit critique interactif : psychologie de groupe et désir mimétique.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Seul style hors conteneur : le fond de page */
body{margin:0;background:#0A1260}

/* ================= VARIABLES & BASE ================= */
#ok-tool{
  --bg-0:#0A1260;--bg-1:#16228A;--yellow:#F5C518;--yellow-d:#C99A00;--navy:#0B1550;
  --light:#EEF1FA;--cream:#FFF6DA;--green:#2E8B57;--green-l:#5BE08F;--red:#C0392B;--red-l:#FF8A7A;
  --orange:#F08C2E;--ease:cubic-bezier(.22,1,.36,1);--top-h:68px;
  --f-title:'Bebas Neue','Anton',Impact,sans-serif;--f-text:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  position:relative;min-height:100vh;color:#fff;font-family:var(--f-text);font-size:17px;line-height:1.5;
  background:linear-gradient(160deg,var(--bg-1),var(--bg-0) 70%);overflow-x:hidden;overflow-x:clip;
  -webkit-font-smoothing:antialiased;text-align:left;
}
#ok-tool *,#ok-tool *::before,#ok-tool *::after{box-sizing:border-box}
#ok-tool button{font:inherit;color:inherit;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ok-tool button:disabled{cursor:default}
#ok-tool h1,#ok-tool h2,#ok-tool h3,#ok-tool p,#ok-tool ul,#ok-tool ol{margin:0}
#ok-tool a{color:inherit}
#ok-tool svg{display:block}
#ok-tool [hidden]{display:none!important}
#ok-tool :focus{outline:none}
#ok-tool :focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
#ok-tool .ok-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
#ok-tool .ok-ic{width:20px;height:20px;flex:none}
#ok-tool .ok-stage *{scroll-margin-top:calc(var(--top-h) + 16px);scroll-margin-bottom:120px}

/* ================= FOND ================= */
#ok-tool .ok-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/48px 48px,
    radial-gradient(ellipse at 50% -10%,rgba(60,90,230,.45),transparent 60%),
    linear-gradient(160deg,var(--bg-1),var(--bg-0) 75%);
  transition:opacity .5s}
#ok-tool .ok-bg-light{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s;
  background:linear-gradient(rgba(11,21,80,.035) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(11,21,80,.035) 1px,transparent 1px) 0 0/48px 48px,var(--light)}
#ok-tool.ok-is-light .ok-bg-light{opacity:1}
#ok-tool .ok-particle{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.18;animation:ok-drift linear infinite}
#ok-tool.ok-is-light .ok-particle{opacity:0}

/* ================= BARRE DU HAUT ================= */
#ok-tool .ok-top{position:fixed;top:0;left:0;right:0;z-index:40;min-height:var(--top-h);display:flex;align-items:center;gap:16px;padding:0 18px;
  background:rgba(12,22,110,.95);border-bottom:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ok-tool .ok-close{flex:none;width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;transition:background .15s}
#ok-tool .ok-close:hover{background:rgba(255,255,255,.12)}
#ok-tool .ok-nav{flex:1 1 0;min-width:0;display:flex}
#ok-tool .ok-progress{flex:1;display:flex;align-items:center;list-style:none;padding:0;min-width:0}
#ok-tool .ok-progress li{flex:1;display:flex;align-items:center;min-width:0}
#ok-tool .ok-progress li:first-child{flex:0 0 auto}
#ok-tool .ok-progress li+li::before{content:"";flex:1;height:2px;margin:0 5px;background:rgba(255,255,255,.18);border-radius:2px;transition:background .5s}
#ok-tool .ok-progress li.is-lit::before{background:var(--yellow)}
#ok-tool .ok-dot{position:relative;flex:none;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:#0D176C;color:rgba(255,255,255,.9);
  font-weight:800;font-size:13px;line-height:1;display:grid;place-items:center;padding:0;transition:transform .15s var(--ease),background .3s,box-shadow .3s,width .3s,height .3s}
#ok-tool .ok-dot::after{content:"";position:absolute;inset:-8px}
#ok-tool .ok-dot.is-done{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
#ok-tool .ok-dot.is-current{background:var(--yellow);border-color:var(--yellow);color:var(--navy);width:36px;height:36px;box-shadow:0 0 0 6px rgba(245,197,24,.22),0 0 20px rgba(245,197,24,.55)}
#ok-tool .ok-dot:not(:disabled):hover{transform:translateY(-2px) scale(1.08)}
#ok-tool .ok-dot svg{width:16px;height:16px}
#ok-tool .ok-dot.is-new svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:ok-draw .5s .1s var(--ease) forwards}
#ok-tool .ok-tag{flex:none;border:1.5px solid var(--yellow);border-radius:999px;padding:8px 16px 6px;font-family:var(--f-title);letter-spacing:.09em;font-size:15px;line-height:1;color:var(--yellow);white-space:nowrap;background:rgba(245,197,24,.07)}
#ok-tool .ok-tag-short{display:none}

/* ================= BAS DE PAGE ================= */
#ok-tool .ok-back{position:fixed;left:20px;bottom:20px;z-index:40;width:54px;height:54px;border-radius:50%;border:0;background:var(--yellow);color:var(--navy);
  display:grid;place-items:center;box-shadow:0 4px 0 var(--yellow-d),0 10px 22px rgba(0,0,0,.35);transition:transform .15s var(--ease),box-shadow .15s}
#ok-tool .ok-back:hover{transform:translateY(-4px)}
#ok-tool .ok-back .ok-ic{width:24px;height:24px}
#ok-tool .ok-dock{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;align-items:flex-end;gap:10px}
#ok-tool .ok-sound{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(10,18,80,.9);color:#fff;display:grid;place-items:center;transition:transform .15s var(--ease)}
#ok-tool .ok-sound:hover{transform:translateY(-4px)}
#ok-tool .ok-sound[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}
#ok-tool .ok-mascot{width:68px;height:68px;border-radius:18px;border:0;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:ok-float 3.4s ease-in-out infinite}
#ok-tool .ok-mascot svg{width:48px;height:48px}
#ok-tool .ok-mascot.ok-jump{animation:ok-jump .5s var(--ease)}
#ok-tool .ok-bubble{position:absolute;right:0;bottom:calc(100% + 14px);width:max-content;max-width:min(290px,calc(100vw - 32px));background:#fff;color:var(--navy);
  padding:12px 16px;border-radius:14px;font-weight:700;font-size:16px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:ok-in .3s var(--ease) both}
#ok-tool .ok-bubble::after{content:"";position:absolute;right:28px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
#ok-tool.ok-is-light .ok-bubble{box-shadow:0 8px 24px rgba(11,21,80,.25);border:1px solid #D9DEF0}

/* ================= ZONE PRINCIPALE ================= */
#ok-tool .ok-main{position:relative;z-index:1;padding:calc(var(--top-h) + 30px) 16px 150px}
#ok-tool .ok-stage{max-width:1100px;margin:0 auto}
#ok-tool .ok-stage.ok-out-left{animation:ok-out-left .3s var(--ease) both}
#ok-tool .ok-stage.ok-out-right{animation:ok-out-right .3s var(--ease) both}
#ok-tool .ok-stage.ok-in-right{animation:ok-in-right .4s var(--ease) both}
#ok-tool .ok-stage.ok-in-left{animation:ok-in-left .4s var(--ease) both}
#ok-tool .ok-swap-out{animation:ok-out-left .3s var(--ease) both}
#ok-tool .ok-swap-in{animation:ok-in-right .4s var(--ease) both}

/* ================= TYPO ================= */
#ok-tool .ok-title{font-family:var(--f-title);font-weight:400;font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.02;letter-spacing:.01em;text-align:center;text-transform:uppercase;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.25)}
#ok-tool .ok-title strong,#ok-tool .ok-bigq strong,#ok-tool .ok-q-caps strong,#ok-tool .ok-y{color:var(--yellow);font-weight:inherit}
#ok-tool .ok-subcaps{font-family:var(--f-title);font-size:clamp(1.25rem,2.6vw,1.6rem);letter-spacing:.06em;text-align:center;color:rgba(255,255,255,.85);margin-top:6px}
#ok-tool .ok-mission{text-align:center;font-size:clamp(16px,1.6vw,18px);margin:14px auto 0;max-width:760px;color:rgba(255,255,255,.95)}
#ok-tool .ok-mission strong{font-weight:900;color:#fff}
#ok-tool .ok-label{font-size:12.5px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;line-height:1.3}
#ok-tool .ok-label-y{color:var(--yellow)}
#ok-tool .ok-center{text-align:center}
#ok-tool .ok-q-caps{font-family:var(--f-title);font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:.03em;text-align:center;margin:30px 0 18px}
#ok-tool .ok-bigq{font-family:var(--f-title);font-size:clamp(1.8rem,3.8vw,2.7rem);line-height:1.08;text-align:center;letter-spacing:.01em;max-width:860px;margin:34px auto 0}
#ok-tool .ok-gap{height:26px}

/* ================= BOUTON PRINCIPAL ================= */
#ok-tool .ok-cta-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:34px 0 8px}
#ok-tool .ok-cta{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:14px 28px;border:0;border-radius:14px;background:var(--yellow);color:var(--navy);
  font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 0 var(--yellow-d),0 10px 24px rgba(0,0,0,.25);
  transition:transform .15s var(--ease),box-shadow .15s,opacity .2s;text-decoration:none;text-align:center}
#ok-tool .ok-cta .ok-ic{width:20px;height:20px}
#ok-tool .ok-cta:not(:disabled):hover{transform:scale(1.04);box-shadow:0 4px 0 var(--yellow-d),0 0 0 6px rgba(245,197,24,.18),0 0 30px rgba(245,197,24,.55)}
#ok-tool .ok-cta:not(:disabled):active{transform:scale(.97)}
#ok-tool .ok-cta:disabled{opacity:.42;box-shadow:none;filter:saturate(.6)}
#ok-tool .ok-cta-in{animation:ok-cta-in .5s var(--ease) both}
#ok-tool .ok-cta-in .ok-cta{animation:ok-glow 1.1s .45s ease-in-out 2}
#ok-tool .ok-help{font-size:14px;color:rgba(255,255,255,.62);transition:opacity .3s}
#ok-tool .ok-help.is-off{opacity:0}

/* ================= ANIMATIONS GÉNÉRIQUES ================= */
#ok-tool .ok-anim-in{animation:ok-in .4s var(--ease) both;animation-delay:var(--d,0ms)}
#ok-tool .ok-pulse{animation:ok-pulse .2s var(--ease)}
#ok-tool .ok-fade-out{animation:ok-fade-out .3s var(--ease) both;pointer-events:none}
#ok-tool .ok-pop{animation:ok-pop .45s var(--ease)}

/* ================= CHOIX A / B / C ================= */
#ok-tool .ok-choices{display:flex;flex-direction:column;gap:12px}
#ok-tool .ok-opt{transition:transform .15s var(--ease),box-shadow .15s,opacity .3s,background-color .3s,border-color .3s,color .3s}
#ok-tool .ok-choice{width:100%;display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 16px;border-radius:14px;text-align:left;font-weight:700;font-size:16.5px;line-height:1.35;
  background:#fff;color:var(--navy);border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#ok-tool .ok-choice:not(:disabled):hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.28)}
#ok-tool .ok-choice-txt{flex:1}
#ok-tool .ok-letter{flex:none;width:30px;height:30px;border-radius:8px;background:#E4E8F6;color:var(--navy);display:grid;place-items:center;font-family:var(--f-title);font-size:18px;line-height:1}
#ok-tool .ok-mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;opacity:0}
#ok-tool .ok-mark svg{width:17px;height:17px}
#ok-tool .ok-mark svg path{stroke-dasharray:26;stroke-dashoffset:26;animation:ok-draw .4s .1s var(--ease) forwards}
#ok-tool .is-correct .ok-mark,#ok-tool .is-wrong .ok-mark{opacity:1}
#ok-tool .ok-choice.is-correct{background:var(--green);border-color:var(--green-l);color:#fff;box-shadow:0 0 0 3px rgba(91,224,143,.35),0 0 24px rgba(91,224,143,.45);opacity:1}
#ok-tool .ok-choice.is-wrong{background:var(--red);border-color:var(--red-l);color:#fff;box-shadow:0 0 0 3px rgba(255,138,122,.3)}
#ok-tool .ok-choice.is-correct .ok-letter,#ok-tool .ok-choice.is-wrong .ok-letter{background:rgba(255,255,255,.22);color:#fff}
#ok-tool .ok-choice.is-correct .ok-mark,#ok-tool .ok-choice.is-wrong .ok-mark{background:rgba(255,255,255,.22)}
#ok-tool .ok-opt.is-dim{opacity:.45}
#ok-tool .ok-opt:disabled{cursor:default}
#ok-tool .ok-opt.ok-bounce{animation:ok-bounce .3s var(--ease)}
#ok-tool .ok-opt.ok-shake{animation:ok-shake .3s linear}
/* variante sombre (enquêtes) */
#ok-tool .ok-choices.is-dark .ok-choice{background:rgba(255,255,255,.07);color:#fff;border:1.5px solid rgba(255,255,255,.2);box-shadow:none}
#ok-tool .ok-choices.is-dark .ok-choice:not(:disabled):hover{background:rgba(255,255,255,.12);box-shadow:0 10px 24px rgba(0,0,0,.25)}
#ok-tool .ok-choices.is-dark .ok-letter{background:rgba(255,255,255,.16);color:#fff}
#ok-tool .ok-choices.is-dark .ok-choice.is-correct{background:rgba(46,139,87,.45);border-color:var(--green-l)}
#ok-tool .ok-choices.is-dark .ok-choice.is-wrong{background:rgba(192,57,43,.45);border-color:var(--red-l)}

/* ================= CASES D'EXPLICATION ================= */
#ok-tool .ok-explain{background:var(--cream);color:var(--navy);border:1.5px solid var(--yellow);border-left-width:5px;border-radius:14px;padding:16px 18px;font-size:16.5px;line-height:1.55}
#ok-tool .ok-explain strong{font-weight:900}
#ok-tool .ok-explain .ok-label{color:#8A6A00;margin-bottom:6px}
#ok-tool .ok-res-title{font-family:var(--f-title);font-size:1.5rem;letter-spacing:.03em;line-height:1.1;margin-bottom:4px}
#ok-tool .ok-res-ok{color:#1F7A47}
#ok-tool .ok-res-ko{color:#B3281A}
#ok-tool .ok-tagword{display:inline;background:var(--navy);color:#fff!important;padding:1px 8px;border-radius:6px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:.92em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#ok-tool .ok-verdict{background:rgba(255,255,255,.05);border:2px solid var(--yellow);border-radius:16px;padding:16px 20px;font-size:16.5px;line-height:1.55;color:#fff}
#ok-tool .ok-verdict strong{font-weight:900;color:#fff;text-transform:uppercase;font-size:.95em;letter-spacing:.01em}
#ok-tool .ok-verdict-h{display:flex;align-items:center;gap:8px;font-family:var(--f-title);font-size:1.45rem;letter-spacing:.05em;color:var(--yellow);line-height:1.1;margin-bottom:6px}
#ok-tool .ok-verdict-h .ok-ic{width:22px;height:22px}
#ok-tool .ok-verdict p+p{margin-top:8px}
#ok-tool .ok-def{color:rgba(255,255,255,.9)}
#ok-tool .ok-def b{color:var(--yellow);font-weight:900}

/* ================= CARTES ================= */
#ok-tool .ok-dark{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px}
#ok-tool .ok-panel{background:var(--light);color:var(--navy);border-radius:22px;padding:clamp(18px,3.5vw,40px);box-shadow:0 8px 24px rgba(0,0,0,.25);margin-top:30px;min-height:420px}
#ok-tool .ok-whitecard{background:#fff;color:var(--navy);border-radius:16px;padding:18px 22px;box-shadow:0 8px 24px rgba(0,0,0,.25);border:2px solid var(--yellow)}
#ok-tool .ok-whitecard strong{font-weight:900}
#ok-tool .ok-whitecard .ok-label{color:var(--navy);margin-bottom:8px;letter-spacing:.22em}
#ok-tool .ok-warnbox{display:flex;gap:14px;align-items:flex-start;border:2px dashed var(--yellow);border-radius:16px;padding:16px 20px;background:rgba(245,197,24,.07);font-size:17px}
#ok-tool .ok-warnbox .ok-ic{width:28px;height:28px;color:var(--yellow);margin-top:2px}
#ok-tool .ok-warnbox strong{color:var(--yellow);font-weight:900}

/* ================= CITATION ================= */
#ok-tool .ok-quote{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-left:5px solid var(--yellow);border-radius:16px;padding:22px 26px;max-width:760px;margin:34px auto 0}
#ok-tool .ok-quote .ok-label{color:var(--yellow);margin-bottom:10px;display:flex;align-items:center;gap:8px}
#ok-tool .ok-quote-txt{font-family:var(--f-title);font-size:clamp(1.55rem,3vw,2.15rem);line-height:1.12;letter-spacing:.01em;text-transform:uppercase}
#ok-tool .ok-quote-txt strong{color:var(--yellow);font-weight:inherit}
#ok-tool .ok-author{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:14.5px;color:rgba(255,255,255,.85)}
#ok-tool .ok-author .ok-bookic{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center}
#ok-tool .ok-author .ok-bookic .ok-ic{width:16px;height:16px}
#ok-tool .ok-author-name{font-family:var(--f-title);font-size:1.2rem;letter-spacing:.05em;color:#fff}
#ok-tool .ok-author-role{font-weight:800;color:#fff}
#ok-tool .ok-sep{opacity:.5}
#ok-tool .ok-quotes2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
#ok-tool .ok-quotes2 .ok-quote{margin:0;max-width:none}
#ok-tool .ok-quote.is-center{text-align:center;border-left-width:1px;border-color:rgba(255,255,255,.2)}
#ok-tool .ok-quote.is-center .ok-label{justify-content:center}
#ok-tool .ok-quote.is-center .ok-author{justify-content:center}
#ok-tool .ok-quote.is-center .ok-quote-txt{font-family:var(--f-text);font-weight:800;text-transform:none;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.4}

/* ================= ÉTAPE 1 ================= */
#ok-tool .ok-shoes{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:900px;margin:0 auto}
#ok-tool .ok-shoe-card{position:relative;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);border-radius:18px;padding:18px 22px 16px;display:flex;flex-direction:column;align-items:center;transition:transform .15s var(--ease),box-shadow .2s}
#ok-tool .ok-shoe-card.is-limited{border-color:rgba(245,197,24,.75);box-shadow:0 0 26px rgba(245,197,24,.12)}
#ok-tool .ok-shoe-badges{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;min-height:32px}
#ok-tool .ok-badge-y{background:var(--yellow);color:var(--navy);font-weight:900;font-size:13px;letter-spacing:.12em;padding:6px 12px;border-radius:8px}
#ok-tool .ok-shoe-note{font-size:14.5px;font-weight:700;color:var(--yellow)}
#ok-tool .ok-badge-soft{font-size:14.5px;font-weight:700;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px}
#ok-tool .ok-shoe-img{width:100%;max-width:300px;margin:8px 0 4px}
#ok-tool .ok-shoe-img svg{width:100%;height:auto}
#ok-tool .ok-price{font-family:var(--f-title);font-size:clamp(2.4rem,5vw,3.2rem);line-height:1;color:#fff;letter-spacing:.02em}
#ok-tool .ok-price.ok-tick{animation:ok-tick .2s var(--ease)}
#ok-tool .ok-range-wrap{width:100%}
#ok-tool .ok-range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;margin:4px 0 0;--p:50%}
#ok-tool .ok-range::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--yellow) 0 var(--p),rgba(169,193,255,.38) var(--p) 100%)}
#ok-tool .ok-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:var(--yellow);margin-top:-9px;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4);transition:transform .15s}
#ok-tool .ok-range:not(:disabled):hover::-webkit-slider-thumb{transform:scale(1.12)}

#ok-tool .ok-case-title{font-family:var(--f-title);font-weight:400;font-size:clamp(2rem,4.4vw,2.8rem);letter-spacing:.02em;line-height:1;margin-top:14px}
#ok-tool .ok-case-ctx{margin-top:16px;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px 18px;background:rgba(255,255,255,.04)}
#ok-tool .ok-case-ctx p{font-size:17px}
#ok-tool .ok-case-ctx strong{font-weight:900}
#ok-tool .ok-case-ctx hr{border:0;border-top:1px solid rgba(255,255,255,.15);margin:14px 0}
#ok-tool .ok-case-q{font-family:var(--f-title);font-size:clamp(1.35rem,2.6vw,1.75rem)!important;letter-spacing:.03em;text-align:center;line-height:1.12}
#ok-tool .ok-case-video{margin:20px 0 18px;text-align:center}
#ok-tool .ok-vid-title{font-weight:900;font-size:17px}
#ok-tool .ok-observe{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;color:rgba(255,255,255,.9);margin:4px 0 14px;flex-wrap:wrap}

#ok-tool .ok-capsule{display:flex;align-items:center;gap:12px;border:2px solid var(--yellow);border-radius:999px;padding:14px 24px;color:var(--yellow);font-weight:900;font-size:17px;line-height:1.35;background:rgba(245,197,24,.06)}

/* ================= VIDÉO (FAÇADE) ================= */
#ok-tool .ok-video{position:relative;margin:0 auto;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#2236B8,#0B1550);box-shadow:0 10px 30px rgba(0,0,0,.35);aspect-ratio:16/9;width:100%}

#ok-tool .ok-facade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
#ok-tool .ok-facade.is-fail img{display:none}
#ok-tool .ok-facade:hover img{transform:scale(1.04)}
#ok-tool .ok-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,50,.15),rgba(6,10,50,.7))}
#ok-tool .ok-playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(245,197,24,.25),0 10px 26px rgba(0,0,0,.4);transition:transform .2s var(--ease)}

#ok-tool .ok-playbtn .ok-ic{width:30px;height:30px;margin-left:4px}
#ok-tool .ok-facade-title{position:absolute;left:12px;right:12px;bottom:14px;color:#fff;font-weight:800;font-size:15px;line-height:1.3;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#ok-tool .ok-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ok-tool .ok-yt-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:6px;font-weight:800;font-size:15px;color:var(--yellow);text-decoration:underline;text-underline-offset:3px}
#ok-tool.ok-is-light .ok-yt-link{color:var(--navy)}

/* ================= ÉTAPE 7 ================= */
#ok-tool .ok-words{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
#ok-tool .ok-word{border-radius:16px;padding:20px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,rgba(255,255,255,.04))}
#ok-tool .ok-word-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#ok-tool .ok-word-h span.ok-sq{width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--c) 25%,transparent);color:var(--c);display:grid;place-items:center;flex:none}
#ok-tool .ok-word h3{font-family:var(--f-title);font-weight:400;font-size:1.5rem;letter-spacing:.03em;line-height:1.05}
#ok-tool .ok-word p{font-size:16.5px}
#ok-tool .ok-word strong{color:var(--yellow);font-weight:900}
#ok-tool .ok-quiz{display:grid;grid-template-columns:64px 1fr;gap:clamp(14px,3vw,32px);max-width:920px;margin:28px auto 0}
#ok-tool .ok-xp{display:flex;flex-direction:column;align-items:center;gap:8px}
#ok-tool .ok-xp-lbl{font-family:var(--f-title);font-size:1.2rem;letter-spacing:.12em;color:var(--yellow)}
#ok-tool .ok-xp-track{width:16px;height:280px;border-radius:12px;background:rgba(255,255,255,.12);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
#ok-tool .ok-xp-fill{position:absolute;inset:0;background:linear-gradient(0deg,var(--yellow),#FFE07A);transform-origin:bottom;transform:scaleY(0);transition:transform .6s var(--ease)}
#ok-tool .ok-xp-val{font-family:var(--f-title);font-size:1.9rem;color:var(--yellow);line-height:1}
#ok-tool .ok-xp-flame{color:#FF9B45;display:flex;align-items:center;gap:3px;font-weight:800;font-size:14px}
#ok-tool .ok-xp-flame .ok-ic{width:18px;height:18px}
#ok-tool .ok-qnum{color:rgba(255,255,255,.75);margin-bottom:12px}
#ok-tool .ok-qnum span{color:var(--yellow)}
#ok-tool .ok-qrow{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
#ok-tool .ok-qcube{flex:none;width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#ok-tool .ok-qcube svg{width:42px;height:42px}
#ok-tool .ok-qbubble{position:relative;flex:1;background:#fff;color:var(--navy);border-radius:18px;padding:16px 20px;font-family:var(--f-title);font-size:clamp(1.3rem,2.5vw,1.7rem);line-height:1.15;letter-spacing:.01em;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#ok-tool .ok-qbubble::before{content:"";position:absolute;left:-9px;top:20px;border:9px solid transparent;border-right-color:#fff;border-left:0}
#ok-tool .ok-q-fbrow{display:grid;grid-template-columns:1fr auto;gap:14px;margin-top:16px;align-items:stretch}
#ok-tool .ok-qfb{border-radius:16px;padding:16px 18px;font-size:16.5px;line-height:1.5;background:rgba(255,255,255,.05)}
#ok-tool .ok-qfb.is-ok{border:2px solid var(--green-l)}
#ok-tool .ok-qfb.is-ko{border:2px solid var(--red-l)}
#ok-tool .ok-qfb h4{margin:0 0 4px;font-family:var(--f-title);font-weight:400;font-size:1.4rem;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
#ok-tool .ok-qfb.is-ok h4{color:var(--green-l)}
#ok-tool .ok-qfb.is-ko h4{color:var(--red-l)}
#ok-tool .ok-qfb strong{font-weight:900;text-transform:uppercase;font-size:.95em}
#ok-tool .ok-qnext{min-width:130px;border:0;border-radius:16px;background:var(--yellow);color:var(--navy);font-family:var(--f-title);font-size:1.35rem;letter-spacing:.05em;padding:14px 16px;line-height:1.1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 var(--yellow-d),0 10px 24px rgba(0,0,0,.25);transition:transform .15s var(--ease),box-shadow .15s}
#ok-tool .ok-qnext:hover{transform:scale(1.04);box-shadow:0 4px 0 var(--yellow-d),0 0 30px rgba(245,197,24,.5)}
#ok-tool .ok-bravo{text-align:center;padding-top:10px}
#ok-tool .ok-trophy{width:96px;height:96px;margin:0 auto;border-radius:22px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;box-shadow:0 0 40px rgba(245,197,24,.45)}
#ok-tool .ok-trophy .ok-ic{width:46px;height:46px}
#ok-tool .ok-bravo-t{font-family:var(--f-title);font-size:clamp(4.2rem,12vw,7rem);line-height:.95;margin-top:18px}
#ok-tool .ok-bravo-t strong{color:var(--yellow);font-weight:inherit}
#ok-tool .ok-unlock{font-weight:800;letter-spacing:.08em;font-size:17px;margin-top:6px;color:rgba(255,255,255,.9)}
#ok-tool .ok-level{font-family:var(--f-title);font-size:clamp(2.2rem,6vw,3.4rem);color:var(--yellow);line-height:1;text-shadow:0 0 24px rgba(245,197,24,.4)}
#ok-tool .ok-stats{display:inline-grid;grid-template-columns:repeat(3,auto);margin-top:28px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:16px;overflow:hidden}
#ok-tool .ok-stat{padding:14px 26px;text-align:center}
#ok-tool .ok-stat+.ok-stat{border-left:1px solid rgba(255,255,255,.14)}
#ok-tool .ok-stat b{display:block;font-family:var(--f-title);font-weight:400;font-size:2.6rem;line-height:1;color:var(--yellow)}
#ok-tool .ok-stat b small{font-size:.45em;color:#fff;margin-left:2px;letter-spacing:.05em}
#ok-tool .ok-stat:nth-child(2) b{color:#fff}
#ok-tool .ok-stat:nth-child(3) b{color:var(--green-l)}
#ok-tool .ok-stat>span{font-size:12.5px;font-weight:900;letter-spacing:.16em;color:rgba(255,255,255,.7)}

/* ================= ÉTAPE 8 (FOND CLAIR) ================= */
#ok-tool.ok-is-light{background:var(--light)}
#ok-tool.ok-is-light .ok-main{color:var(--navy)}
#ok-tool .ok-tri.is-p2 .ok-smoke-all{display:none}
#ok-tool .ok-s8-kicker{display:flex;align-items:center;justify-content:center;gap:12px;color:#5A6390}
#ok-tool .ok-s8-kicker::before,#ok-tool .ok-s8-kicker::after{content:"";width:28px;height:1.5px;background:#9AA2C6}
#ok-tool .ok-s8-title{font-family:var(--f-title);font-weight:400;font-size:clamp(2.6rem,6vw,4rem);color:var(--navy);text-align:center;line-height:1;margin-top:10px;letter-spacing:.02em}
#ok-tool .ok-s8-sub{text-align:center;color:#3E4775;margin-top:12px;font-size:17px}
#ok-tool .ok-s8-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:34px;align-items:start}
#ok-tool .ok-s8-card{background:#fff;border-radius:22px;padding:clamp(18px,3vw,28px);box-shadow:0 10px 30px rgba(11,21,80,.1);border:1px solid #E1E5F2;color:var(--navy)}
#ok-tool .ok-cover-wrap{display:flex;justify-content:center;padding:10px 0 20px}
#ok-tool .ok-cover{width:min(190px,60%);height:auto;transform:rotate(-4deg);filter:drop-shadow(0 16px 22px rgba(11,21,80,.35));transition:transform .3s var(--ease)}
#ok-tool .ok-s8-card:hover .ok-cover{transform:rotate(-1deg) translateY(-4px)}
#ok-tool .ok-chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;background:#E9ECF8;color:var(--navy)}
#ok-tool .ok-chip.is-navy{background:var(--navy);color:#fff}
#ok-tool .ok-chip.is-cream{background:var(--cream);color:#6B5200}
#ok-tool .ok-chip .ok-ic{width:15px;height:15px}
#ok-tool .ok-s8-h{font-family:var(--f-title);font-weight:400;font-size:clamp(1.9rem,3.6vw,2.5rem);line-height:1;color:var(--navy);margin-top:14px;letter-spacing:.02em}
#ok-tool .ok-s8-meta{font-size:15px;color:#5A6390;margin-top:6px;font-weight:700}
#ok-tool .ok-hook{font-family:var(--f-title);font-size:clamp(1.35rem,2.6vw,1.65rem);line-height:1.15;margin-top:16px;color:var(--navy);letter-spacing:.01em}
#ok-tool .ok-hook strong{background:#FCE9A6;padding:0 .18em;font-weight:inherit;border-radius:4px}
#ok-tool .ok-s8-p{font-size:16.5px;line-height:1.6;color:#2A3366;margin-top:12px}
#ok-tool .ok-s8-p strong{color:var(--navy);font-weight:900}
#ok-tool .ok-s8-p b{font-weight:900;color:var(--navy)}
#ok-tool .ok-btn-navy{display:inline-flex;align-items:center;gap:8px;min-height:48px;margin-top:18px;padding:12px 22px;border-radius:999px;background:var(--navy);color:#fff!important;text-decoration:none;font-weight:900;font-size:15px;letter-spacing:.08em;transition:transform .15s var(--ease),box-shadow .15s}
#ok-tool .ok-btn-navy:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(11,21,80,.3)}
#ok-tool .ok-btn-navy .ok-ic{width:18px;height:18px}
#ok-tool .ok-mission-box{margin-top:14px;background:var(--light);border-radius:14px;padding:12px 16px}
#ok-tool .ok-mission-box p{margin-top:6px;font-size:16.5px;color:#2A3366}
#ok-tool .ok-mission-box strong{font-weight:900;color:var(--navy)}
#ok-tool .ok-s8-card .ok-video{margin-top:18px}
#ok-tool .ok-s8-card .ok-yt-wrap{text-align:center}
#ok-tool .ok-replay{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:12px 30px;border-radius:14px;background:transparent;border:2px solid var(--navy);color:var(--navy);font-weight:900;font-size:16px;letter-spacing:.08em;transition:transform .15s var(--ease),background .2s,color .2s}
#ok-tool .ok-replay:hover{background:var(--navy);color:#fff;transform:scale(1.04)}
#ok-tool .ok-replay .ok-ic{width:20px;height:20px}

/* ================= MODALE ================= */
#ok-tool .ok-modal{position:fixed;inset:0;z-index:100;background:rgba(5,9,40,.72);display:grid;place-items:center;padding:16px;animation:ok-fade-in .2s both}
#ok-tool .ok-modal-card{background:#fff;color:var(--navy);border-radius:20px;padding:28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:ok-in .3s var(--ease) both}
#ok-tool .ok-modal-card h2{font-family:var(--f-title);font-weight:400;font-size:2.3rem;line-height:1;letter-spacing:.02em}
#ok-tool .ok-modal-card p{margin-top:10px;color:#3E4775}
#ok-tool .ok-modal-actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
#ok-tool .ok-modal-actions button{min-width:130px;min-height:48px;border-radius:12px;font-weight:900;letter-spacing:.05em;font-size:15px;text-transform:uppercase;transition:transform .15s var(--ease)}
#ok-tool .ok-modal-actions button:hover{transform:translateY(-3px)}
#ok-tool .ok-btn-stay{background:var(--yellow);color:var(--navy);border:0;box-shadow:0 4px 0 var(--yellow-d)}
#ok-tool .ok-btn-quit{background:#fff;color:var(--navy);border:2px solid var(--navy)}

/* ================= KEYFRAMES ================= */
@keyframes ok-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ok-fade-in{from{opacity:0}to{opacity:1}}
@keyframes ok-fade-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes ok-cta-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ok-glow{0%,100%{box-shadow:0 4px 0 var(--yellow-d),0 0 0 0 rgba(245,197,24,.0)}50%{box-shadow:0 4px 0 var(--yellow-d),0 0 0 10px rgba(245,197,24,.28),0 0 34px rgba(245,197,24,.6)}}
@keyframes ok-pulse{0%{transform:scale(1)}35%{transform:scale(.97)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes ok-bounce{0%{transform:scale(1)}40%{transform:scale(1.04) translateY(-3px)}100%{transform:none}}
@keyframes ok-shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes ok-draw{to{stroke-dashoffset:0}}
@keyframes ok-out-left{to{opacity:0;transform:translateX(-40px)}}
@keyframes ok-out-right{to{opacity:0;transform:translateX(40px)}}
@keyframes ok-in-right{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes ok-in-left{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes ok-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ok-jump{0%{transform:none}30%{transform:translateY(-12px) scale(1.06)}60%{transform:translateY(0) scale(.96)}100%{transform:none}}
@keyframes ok-drift{0%{transform:translate(0,0)}50%{transform:translate(30px,-60px)}100%{transform:translate(0,0)}}
@keyframes ok-dots{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
@keyframes ok-halo{0%,100%{box-shadow:0 4px 0 var(--yellow-d),0 0 0 6px rgba(245,197,24,.2)}50%{box-shadow:0 4px 0 var(--yellow-d),0 0 0 14px rgba(245,197,24,.08)}}
@keyframes ok-tick{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ok-flash{0%{transform:none}40%{transform:translateY(-8px) scale(1.04);box-shadow:0 0 0 4px var(--yellow),0 0 30px rgba(245,197,24,.5)}100%{transform:none}}
@keyframes ok-pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes ok-popin{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{transform:none}}
@keyframes ok-wobble{from{transform:translateX(-10px)}to{transform:translateX(10px)}}

/* ================= RESPONSIVE ================= */
@media (max-width:900px){
  #ok-tool .ok-tag-long{display:none}
  #ok-tool .ok-tag-short{display:inline}
}
@media (max-width:759px){
  #ok-tool{font-size:16px}
  #ok-tool .ok-shoes,#ok-tool .ok-s2-grid,#ok-tool .ok-quotes2,#ok-tool .ok-words,#ok-tool .ok-s8-grid{grid-template-columns:1fr}
  #ok-tool .ok-compare{grid-template-columns:1fr}
  #ok-tool .ok-cmp-neq{transform:rotate(90deg);font-size:1.6rem}

  #ok-tool .ok-fcard{min-height:0}

  #ok-tool .ok-farrow{padding:8px 0;height:56px;align-items:center}
  #ok-tool .ok-farrow svg{transform:rotate(90deg)}
  #ok-tool .ok-quiz{grid-template-columns:44px 1fr}
  #ok-tool .ok-xp-track{height:220px;width:14px}
  #ok-tool .ok-q-fbrow{grid-template-columns:1fr}
  #ok-tool .ok-qnext{flex-direction:row;min-height:52px}
  #ok-tool .ok-qcube{width:46px;height:46px}
  #ok-tool .ok-qcube svg{width:34px;height:34px}
  #ok-tool .ok-stat{padding:12px 16px}
  #ok-tool .ok-stat b{font-size:2.1rem}
  #ok-tool .ok-back{left:14px;bottom:14px;width:50px;height:50px}
  #ok-tool .ok-dock{right:12px;bottom:12px}
  #ok-tool .ok-mascot{width:58px;height:58px}
  #ok-tool .ok-mascot svg{width:40px;height:40px}

}
@media (max-width:600px){
  #ok-tool{--top-h:104px}
  #ok-tool .ok-top{flex-wrap:wrap;padding:6px 12px 8px;gap:4px 10px}
  #ok-tool .ok-nav{flex:1 0 calc(100% - 60px)}
  #ok-tool .ok-tag{order:3;margin:0 auto;font-size:13px;padding:6px 12px 5px}
  #ok-tool .ok-dot{width:26px;height:26px;font-size:12px}
  #ok-tool .ok-dot.is-current{width:30px;height:30px;box-shadow:0 0 0 4px rgba(245,197,24,.22),0 0 14px rgba(245,197,24,.5)}
  #ok-tool .ok-progress li+li::before{margin:0 2px}
  #ok-tool .ok-dot::after{inset:-9px -4px}
  #ok-tool .ok-close{width:40px;height:44px}
  #ok-tool .ok-cta{padding:13px 20px;font-size:15px}
  #ok-tool .ok-pill{padding:9px 14px;font-size:15.5px}
  #ok-tool .ok-panel{border-radius:18px}
}
@media (prefers-reduced-motion:reduce){
  @keyframes ok-in{from{opacity:0}to{opacity:1}}
  @keyframes ok-cta-in{from{opacity:0}to{opacity:1}}
  @keyframes ok-out-left{to{opacity:0}}
  @keyframes ok-out-right{to{opacity:0}}
  @keyframes ok-in-right{from{opacity:0}to{opacity:1}}
  @keyframes ok-in-left{from{opacity:0}to{opacity:1}}
  @keyframes ok-shake{from{opacity:.6}to{opacity:1}}
  @keyframes ok-bounce{from{opacity:.6}to{opacity:1}}
  @keyframes ok-pulse{from{opacity:.7}to{opacity:1}}
  @keyframes ok-float{from{opacity:1}to{opacity:1}}
  @keyframes ok-drift{from{opacity:.18}to{opacity:.18}}
  @keyframes ok-jump{from{opacity:.6}to{opacity:1}}
  @keyframes ok-wobble{from{opacity:1}to{opacity:1}}
  @keyframes ok-flash{from{opacity:.6}to{opacity:1}}

    '<div class="ok-case-fb" aria-live="polite"></div></article>';
  var ans = state.answers['s6-' + i];
  if (ans != null) { resolveChoices($('#ok-case .ok-choices'), ans, K.correct, false); s6Feedback(false); }
}
function chooseS6(j) {
  var i = state.s6.idx, key = 's6-' + i, K = CONTENT.s6.cases[i];
  if (state.answers[key] != null) return;
  state.answers[key] = j;
  if (i === 2) complete(6);
  resolveChoices($('#ok-case .ok-choices'), j, K.correct, true, function () { s6Feedback(true); });
}
function s6Feedback(anim) {
  var C = CONTENT.s6, i = state.s6.idx, K = C.cases[i], j = state.answers['s6-' + i], fb = $('#ok-case .ok-case-fb'); if (!fb) return;
  var A = anim ? ' ok-anim-in' : '';
  var v = add(fb, '<div class="ok-verdict' + A + '"><p class="ok-verdict-h">' + ic('bulb') + esc(C.verdict) + '</p><p>' + fmt(K.choices[j].v) + '</p></div>');
  add(fb, '<p class="ok-capsule' + A + '" style="--d:200ms">' + ic('bulb') + '<span>' + fmt(K.summary) + '</span></p>');
  var last = i === 2;
  var w = add(fb, last ? ctaHTML(C.last, 7, anim) : ctaHTML(C.next, null, anim, 's6next'));
  if (anim) { inView(v); T(function () { focusEl(w.querySelector('button')); inView(w); }, 450); }
}
function s6Next() {
  var S = state.s6;
  if (S.idx >= 2 || state.answers['s6-' + S.idx] == null) return;
  S.idx++;
  var c = $('#ok-case'); if (c) c.classList.add('ok-swap-out');
  var bar = $('.ok-s6-bar div'); if (bar) bar.style.width = ((S.idx + 1) / 3 * 100) + '%';
  T(function () { s6Case(true); var t = $('.ok-title'); if (t) t.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); focusEl($('#ok-case .ok-case-title')); }, 300);
}

/* =====================================================================
   ÉTAPE 7 — JE SAIS L'UTILISER
   ===================================================================== */
RENDER[7] = function renderStep7() {
  var p = state.s7.phase;
  if (p === 'words') s7Words(); else if (p === 'quiz') s7Quiz(); else if (p === 'end') s7End(false); else s7Quote(false);
};
function s7Words() {
  var C = CONTENT.s7;
  stage.innerHTML = titleHTML(C.wordsTitle) + '<p class="ok-mission">' + fmt(C.wordsSub) + '</p>' +
    '<div class="ok-words">' + C.words.map(function (w) {
      return '<div class="ok-word" style="--c:' + w.color + '"><div class="ok-word-h"><span class="ok-sq">' + ic(w.icon) + '</span><h3>' + esc(w.name) + '</h3></div><p>' + fmt(w.text) + '</p></div>';
    }).join('') + '</div>' + ctaHTML(C.play, null, false, 's7play');
}
function s7SetPhase(p) { swapStage(function () { state.s7.phase = p; RENDER[7](); }, 'fwd'); }
function s7Quiz() {
  var C = CONTENT.s7;
  stage.innerHTML = titleHTML(C.title) + missionHTML(C.mission, false) +
    '<div class="ok-quiz"><aside class="ok-xp" aria-label="' + esc(tpl(C.xpAria, { v: state.xp })) + '"><span class="ok-xp-lbl">' + esc(C.xp) + '</span>' +
    '<div class="ok-xp-track"><div class="ok-xp-fill" style="transform:scaleY(' + (state.xp / 30) + ')"></div></div>' +
    '<span class="ok-xp-val">' + state.xp + '</span><span class="ok-xp-flame">' + ic('flame') + '</span></aside><div id="ok-qmain"></div></div>';
  s7Question(false);
}
function s7Question(anim) {
  var C = CONTENT.s7, n = state.s7.q, Q = C.questions[n], m = $('#ok-qmain'); if (!m) return;
  m.innerHTML = '<div class="' + (anim ? 'ok-swap-in' : '') + '" id="ok-qbox"><p class="ok-label ok-qnum">' + esc(tpl(C.qnum, { n: n + 1 })) + ' · <span>' + esc(Q.cat) + '</span></p>' +
    '<div class="ok-qrow"><div class="ok-qcube">' + cubeSVG() + '</div><p class="ok-qbubble">' + fmt(Q.q) + '</p></div>' +
    choicesHTML(Q.choices.map(function (c) { return c.t; }), 's7') + '<div class="ok-q-fb" aria-live="polite"></div></div>';
  var ans = state.answers['s7-' + n];
  if (ans != null) { resolveChoices($('#ok-qbox .ok-choices'), ans, Q.correct, false); s7Feedback(false); }
}
function chooseS7(j) {
  var n = state.s7.q, key = 's7-' + n, Q = CONTENT.s7.questions[n];
  if (state.answers[key] != null) return;
  state.answers[key] = j;
  var ok = j === Q.correct, from = state.xp;
  if (ok) state.xp += 10;
  resolveChoices($('#ok-qbox .ok-choices'), j, Q.correct, true, function () {
    if (ok) {
      var f = $('.ok-xp-fill'); if (f) f.style.transform = 'scaleY(' + (state.xp / 30) + ')';
      countTo($('.ok-xp-val'), from, state.xp, 600);
      var xpbox = $('.ok-xp'); if (xpbox) xpbox.setAttribute('aria-label', tpl(CONTENT.s7.xpAria, { v: state.xp }));
    }
    s7Feedback(true);
  });
}
function s7Feedback(anim) {
  var C = CONTENT.s7, n = state.s7.q, Q = C.questions[n], j = state.answers['s7-' + n], ok = j === Q.correct, fb = $('#ok-qbox .ok-q-fb'); if (!fb) return;
  var row = add(fb, '<div class="ok-q-fbrow' + (anim ? ' ok-anim-in' : '') + '"><div class="ok-qfb ' + (ok ? 'is-ok' : 'is-ko') + '"><h4>' + ic(ok ? 'check' : 'x') + esc(ok ? C.okTitle : C.koTitle) + '</h4><p>' + fmt(Q.choices[j].v) + '</p></div>' +
    '<button type="button" class="ok-qnext" data-act="s7next">' + esc(n < 2 ? C.next : C.result) + ic('arrowR') + '</button></div>');
  if (anim) { inView(row); T(function () { focusEl(row.querySelector('button')); }, 300); }
}
function s7Next() {
  var S = state.s7;
  if (state.answers['s7-' + S.q] == null) return;
  if (S.q < 2) {
    S.q++;
    var b = $('#ok-qbox'); if (b) b.classList.add('ok-swap-out');
    T(function () { s7Question(true); inView($('#ok-qmain')); focusEl($('#ok-qbox .ok-choice')); }, 300);
  } else {
    complete(7);
    if (!state.endTime) state.endTime = Date.now();
    swapStage(function () { state.s7.phase = 'end'; s7End(true); }, 'fwd');
  }
}
function s7End(anim) {
  var C = CONTENT.s7;
  var mins = Math.max(1, Math.round(((state.endTime || Date.now()) - state.startTime) / 60000));
  stage.innerHTML = '<div class="ok-bravo"><div class="ok-trophy' + (anim ? ' ok-endsq ok-pop-in' : '') + '">' + ic('trophy') + '</div>' +
    '<h2 class="ok-bravo-t" tabindex="-1">' + fmt(C.bravo) + '</h2><p class="ok-unlock">' + esc(C.unlock) + '</p><p class="ok-level">' + esc(C.level) + '</p>' +
    '<div class="ok-stats"><div class="ok-stat"><b>' + esc(C.stepsValue) + '</b><span>' + esc(C.statSteps) + '</span></div>' +
    '<div class="ok-stat"><b><span class="ok-cnt" data-to="' + mins + '">' + (anim ? 0 : mins) + '</span><small>' + esc(C.minUnit) + '</small></b><span>' + esc(C.statTime) + '</span></div>' +
    '<div class="ok-stat"><b><span class="ok-cnt" data-to="' + state.xp + '">' + (anim ? 0 : state.xp) + '</span></b><span>' + esc(C.statXp) + '</span></div></div></div>' +
    ctaHTML(C.quoteCta, null, anim, 's7quote');
  if (anim) {
    $$('.ok-cnt').forEach(function (el) { countTo(el, 0, +el.getAttribute('data-to'), 900); });
    T(function () { openBubble(C.mascotEnd); }, 900);
  }
}
function s7Quote(anim) {
  var C = CONTENT.s7;
  stage.innerHTML = '<h2 class="ok-sr ok-title" tabindex="-1">' + esc(C.quoteLabel) + '</h2>' +
    '<div style="padding-top:5vh">' + quoteHTML(C.quote, { center: true, label: C.quoteLabel, anim: anim }) + '</div>' + ctaHTML(C.cta, 8, anim);
}

/* =====================================================================
   ÉTAPE 8 — JE VAIS PLUS LOIN (fond clair)
   ===================================================================== */
function coverSVG(B) {
  return '<svg class="ok-cover" viewBox="0 0 200 290" role="img" aria-label="' + esc(B.coverAria) + '">' +
    '<defs><linearGradient id="ok-cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22339F"/><stop offset="1" stop-color="#0A1260"/></linearGradient></defs>' +
    '<rect width="200" height="290" rx="8" fill="url(#ok-cg)"/><rect x="0" y="0" width="12" height="290" rx="4" fill="rgba(0,0,0,.28)"/><rect x="12" y="0" width="2" height="290" fill="rgba(255,255,255,.12)"/>' +
    '<rect x="30" y="26" width="146" height="22" rx="4" fill="#F5C518"/><text x="103" y="41.5" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-weight="900" font-size="9.5" letter-spacing=".8" fill="#0B1550">' + esc(B.coverBand) + '</text>' +
    B.coverTitle.map(function (t, i) { return '<text x="103" y="' + (128 + i * 34) + '" text-anchor="middle" font-family="\'Bebas Neue\',Anton,Impact,sans-serif" font-size="' + (t.length > 8 ? 30 : 26) + '" fill="#fff" letter-spacing="1">' + esc(t) + '</text>'; }).join('') +
    '<rect x="66" y="232" width="74" height="2" fill="#F5C518"/><text x="103" y="256" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-weight="800" font-size="11" letter-spacing="1.6" fill="#fff">' + esc(B.coverAuthor) + '</text></svg>';
}
RENDER[8] = function renderStep8() {
  var C = CONTENT.s8, B = C.book, V = C.video;
  stage.innerHTML = '<p class="ok-label ok-s8-kicker">' + esc(C.kicker) + '</p><h2 class="ok-s8-title ok-title" tabindex="-1" style="color:var(--navy);text-shadow:none">' + esc(C.title) + '</h2><p class="ok-s8-sub">' + fmt(C.sub) + '</p>' +
    '<div class="ok-s8-grid">' +
    '<article class="ok-s8-card"><div class="ok-cover-wrap">' + coverSVG(B) + '</div>' +
    '<span class="ok-chip">' + ic('book') + esc(B.chip) + '</span><h3 class="ok-s8-h">' + esc(B.title) + '</h3><p class="ok-s8-meta">' + esc(B.meta) + '</p>' +
    '<p class="ok-hook">' + fmt(B.hook) + '</p>' +
    '<p class="ok-s8-p"><b>' + fmt(B.beforeLabel) + '</b> ' + fmt(B.before) + '</p>' +
    '<p class="ok-s8-p"><b>' + fmt(B.summaryLabel) + '</b> ' + fmt(B.summary) + '</p>' +
    '<p class="ok-s8-p"><b>' + fmt(B.whyLabel) + '</b> ' + fmt(B.why) + '</p>' +
    '<p class="ok-s8-p"><b>' + fmt(B.knowLabel) + '</b> ' + fmt(B.know) + '</p>' +
    '<a class="ok-btn-navy" href="' + esc(B.url) + '" target="_blank" rel="noopener" aria-label="' + esc(B.linkAria) + '">' + esc(B.link) + ic('arrowR') + '</a></article>' +
    '<article class="ok-s8-card"><span class="ok-chip is-navy">' + ic('play') + esc(V.chip) + '</span><h3 class="ok-s8-h">' + esc(V.title) + '</h3><p class="ok-s8-meta">' + esc(V.meta) + '</p>' +
    '<div class="ok-mission-box"><span class="ok-chip is-cream">' + ic('target') + esc(V.missionLabel) + '</span><p>' + fmt(V.mission) + '</p></div>' +
    '<p class="ok-s8-p">' + fmt(V.text) + '</p><div class="ok-yt-wrap">' + videoHTML(V.player) + '</div></article></div>' +
    '<div class="ok-cta-wrap"><button type="button" class="ok-replay" data-act="replay">' + ic('refresh') + esc(C.replay) + '</button></div>';
};

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
var CHOOSE = { s2: chooseS2, s5: chooseS5, s6: chooseS6, s7: chooseS7 };
var ACT = {
  next: function (el) { var n = parseInt(el.getAttribute('data-to'), 10); if (n) goToStep(n, 'fwd'); },
  goto: function (el) { var n = parseInt(el.getAttribute('data-step'), 10); if (!n || n === state.step || n > state.maxStep) return; goToStep(n, n < state.step ? 'back' : 'fwd'); },
  back: function () { if (state.step > 1) goToStep(state.step - 1, 'back'); },
  quit: openModal, stay: closeModal,
  doQuit: function () { closeModal(); resetAll(); },
  replay: resetAll,
  sound: toggleSound, mascot: toggleBubble,
  choose: function (el) { var g = el.getAttribute('data-group'), f = CHOOSE[g]; if (f && g === 's' + state.step) f(parseInt(el.getAttribute('data-i'), 10)); },
  s1validate: s1Validate, s2send: s2Send, s3next: s3Next, s3loop: s3Loop, s4clear: s4Clear,
  s5next: s5Next, s6next: s6Next,
  s7play: function () { s7SetPhase('quiz'); }, s7next: s7Next,
  s7quote: function () { swapStage(function () { state.s7.phase = 'quote'; s7Quote(true); }, 'fwd'); },
  playVideo: playVideo
};
var FREE = { quit: 1, stay: 1, doQuit: 1, sound: 1, mascot: 1 };
root.addEventListener('click', function (e) {
  var modal = $('.ok-modal');
  if (!modal.hidden && e.target === modal) { closeModal(); return; }
  var a = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!a || !root.contains(a) || a.disabled) return;
  var name = a.getAttribute('data-act');
  if (busy && !FREE[name]) return;
  if (name !== 'choose' && name !== 'mascot') { restart(a, 'ok-pulse'); sfx('click'); }
  if (ACT[name]) ACT[name](a, e);
});
root.addEventListener('input', function (e) {
  var r = e.target;
  if (r && r.classList && r.classList.contains('ok-range')) onRange(r);
});
document.addEventListener('keydown', function (e) {
  var modal = $('.ok-modal');
  if (e.key === 'Escape' || e.key === 'Esc') {
    if (!modal.hidden) { e.preventDefault(); closeModal(); }
    else if (!$('#ok-bubble').hidden) { e.preventDefault(); closeBubble(); }
    return;
  }
  if (e.key === 'Tab' && !modal.hidden) { /* focus piégé dans la modale */
    var f = $$('button', modal), first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); focusEl(last); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); focusEl(first); }
    else if (f.indexOf(document.activeElement) < 0) { e.preventDefault(); focusEl(first); }
  }
});
var resizeT = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeT);
  resizeT = setTimeout(function () {
    if (busy) return;
    if (state.step === 3 && state.s3.loop) drawLoop(false);
    if (state.step === 4 && $('#ok-triframe')) {
      var mode = ($('#ok-triframe').clientWidth >= 560) ? 'wide' : 'narrow';
      if (mode !== triMode) {
        mountTri();
        var b = $('.ok-smoke-btn'); if (b) b.style.top = buildTri(state.s4.phase).smokeTop + '%';
      }
    }
  }, 150);
});

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
buildChrome();
RENDER[1](false);
updateChrome();
})();
</script>
</body>
</html>
